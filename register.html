<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ferreteria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="encabezado">
        <h1>Ferreteria Los Maestros</h1>
        <p><b>Formulario de Registro</b></p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Registro</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form id="register">
            <fieldset>
                <h1>Crea tu cuenta</h1>
                
                <label>Nombre Completo: </label>
                <input type="text" placeholder="Ingrese su nombre" required id="nombre">
                
                <label>Rut: </label>
                <input type="text" placeholder="Ej: 12.345.678-9" required id="rut">
                
                <label>Email: </label>
                <input type="email" placeholder="ejemplo@duocuc.cl" required id="email">
                
                <label>Contraseña: </label>
                <input type="password" placeholder="Solo caracteres validos" required id="contrasenia">
                
                <label>Confirmar Contraseña: </label>
                <input type="password" placeholder="Repita su contraseña" required id="confirmar_contrasenia">
                
                <label>Telefono: </label>
                <input type="tel" placeholder="+56912345678" required id="telefono">
                
                <label>Fecha de nacimiento: </label>
                <input type="date" required id="fenac">
                
                <button type="submit">Registrarse</button>

                <div style="text-align: center; margin-top: 20px;">
                    <p><a href="login.html" style="color: var(--azul-medio); text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a></p>
                    <p style="margin-top: 10px;"><a href="index.html" style="color: #666; text-decoration: none; font-size: 0.9em;">Volver a la página principal</a></p>
                </div>
            </fieldset>
        </form>
    </main>
    <footer style="background-color: var(--azul-oscuro); color: white; text-align: center; padding: 20px; margin-top: 40px;">
        <p>&copy; 2026 Ferretería. Todos los derechos reservados.</p>
    </footer>
    <script src="validaciones.js"></script>
</body>
</html>
